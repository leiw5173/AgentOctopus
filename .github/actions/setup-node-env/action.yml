name: "Setup Node.js + pnpm + dependencies"
description: "Composite action: Node 22, pnpm, frozen install"

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "22"
  install-deps:
    description: "Run pnpm install --frozen-lockfile"
    required: false
    default: "true"
  registry-url:
    description: "npm registry URL (only needed for publish)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      if: inputs.install-deps == 'true'
      run: pnpm install --frozen-lockfile
      shell: bash
