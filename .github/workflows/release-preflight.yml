name: Release Preflight

on:
  push:
    branches:
      - master

concurrency:
  group: preflight-master
  cancel-in-progress: false

jobs:
  validate-version:
    name: 🔍 Validate Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      - name: Check version not already published
        run: |
          VERSION=$(node -p "require('./packages/agentoctopus/package.json').version")
          echo "Package version: $VERSION"
          if npm view agentoctopus@$VERSION version > /dev/null 2>&1; then
            echo "ERROR: agentoctopus@$VERSION already exists on npm. Bump the version."
            exit 1
          fi
          echo "OK: agentoctopus@$VERSION not published yet."

  audit:
    name: 🔒 Pre-publish Audit
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      - name: Lint all workspaces
        run: pnpm -r lint
      - name: Build all packages (topological order)
        run: pnpm -r --workspace-concurrency=1 build
      - name: Run all tests
        run: pnpm -r test
        env:
          CI: true

  pack:
    name: 📦 Pack Tarballs
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      - name: Build all packages
        run: pnpm -r --workspace-concurrency=1 build
      - name: Pack and write metadata
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(node -p "require('./packages/agentoctopus/package.json').version")
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          mkdir -p /tmp/preflight
          echo "$SHA" > /tmp/preflight/release-sha.txt
          echo "v$VERSION" > /tmp/preflight/release-tag.txt
          echo "$VERSION" > /tmp/preflight/release-version.txt

          PACKAGES="skills registry adapters core gateway cli agentoctopus"
          for pkg in $PACKAGES; do
            case "$pkg" in
              cli)       cd apps/cli && npm pack --pack-destination /tmp/preflight && cd - > /dev/null ;;
              agentoctopus) cd packages/agentoctopus && npm pack --pack-destination /tmp/preflight && cd - > /dev/null ;;
              *)         cd packages/$pkg && npm pack --pack-destination /tmp/preflight && cd - > /dev/null ;;
            esac
          done

          echo "Packed tarballs:"
          ls -la /tmp/preflight/*.tgz
        shell: bash
      - name: Upload preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: preflight-${{ github.sha }}
          path: /tmp/preflight/
          retention-days: 7
