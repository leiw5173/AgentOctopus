name: CD — Publish to npm

on:
  push:
    tags:
      # Trigger on semantic version tags, e.g. v0.4.11, v1.0.0
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"   # pre-releases: v1.0.0-beta.1

  # Allow manual dispatch for re-publishing without a new tag
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Re-run CI gate before publishing
  # ─────────────────────────────────────────────
  audit:
    name: 🔒 Pre-publish Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages (topological order)
        run: pnpm -r --workspace-concurrency=1 build

      - name: Run all tests
        run: pnpm -r test
        env:
          CI: true

  # ─────────────────────────────────────────────
  # Job 2: Publish each public package to npm
  # ─────────────────────────────────────────────
  publish:
    name: 🚀 Publish to npm
    runs-on: ubuntu-latest
    needs: audit
    permissions:
      contents: read
      id-token: write   # required for npm provenance attestation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages (topological order)
        run: pnpm -r --workspace-concurrency=1 build

      # ── Publish order: leaf packages first, then dependents ──

      - name: Publish @agentoctopus/registry
        working-directory: packages/registry
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            pnpm publish --no-git-checks --dry-run
          else
            pnpm publish --no-git-checks --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @agentoctopus/adapters
        working-directory: packages/adapters
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            pnpm publish --no-git-checks --dry-run
          else
            pnpm publish --no-git-checks --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @agentoctopus/core
        working-directory: packages/core
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            pnpm publish --no-git-checks --dry-run
          else
            pnpm publish --no-git-checks --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @agentoctopus/gateway
        working-directory: packages/gateway
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            pnpm publish --no-git-checks --dry-run
          else
            pnpm publish --no-git-checks --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish agentoctopus (CLI)
        working-directory: packages/agentoctopus
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            pnpm publish --no-git-checks --dry-run
          else
            pnpm publish --no-git-checks --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release summary
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "## ✅ Published packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Version |" >> $GITHUB_STEP_SUMMARY
          echo "| ------- | ------- |" >> $GITHUB_STEP_SUMMARY
          for pkg in packages/registry packages/adapters packages/core packages/gateway packages/agentoctopus; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            echo "| \`$name\` | \`$version\` |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tag: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
